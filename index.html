<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACF Club Early Access</title>
  <meta name="description" content="Join the ACF Club early access wait list.">
  <script src="https://cdn.brevo.com/js/sdk-loader.js" async></script>
  <script>
    window.Brevo = window.Brevo || [];
    Brevo.push(["init", { client_key: "k7wnwhcqzc3lbhu0qlh26lmd" }]);
  </script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#111827;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    main{width:100%;max-width:460px}
    h1{font-size:32px;line-height:1.15;margin:0 0 16px}
    p{font-size:17px;line-height:1.5;margin:0 0 26px}
    label{display:block;font-weight:700;margin:0 0 7px}
    input{width:100%;font:inherit;padding:14px 15px;border:1px solid #cbd5e1;border-radius:8px;margin:0 0 17px;background:#fff}
    input:focus{outline:2px solid #111827;outline-offset:2px}
    button{width:100%;border:0;border-radius:8px;background:#111827;color:#fff;font:inherit;font-weight:700;padding:15px 18px;cursor:pointer}
    button:disabled{opacity:.65;cursor:not-allowed}
    .fineprint{font-size:12px;line-height:1.45;color:#6b7280;margin-top:14px}
    .status{margin-top:16px;font-size:15px;font-weight:700;min-height:22px}
    .hp{position:absolute;left:-9999px;opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <main>
    <h1>Join the wait list</h1>
    <p>Join the wait list to hear about when ACF Club will launch and receive 3 months free when you sign up in the launch window.</p>

    <form id="earlyAccessForm">
      <label for="firstName">First name</label>
      <input id="firstName" name="firstName" type="text" autocomplete="given-name" required maxlength="80">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">

      <label for="postcode">Postcode</label>
      <input id="postcode" name="postcode" type="text" inputmode="numeric" autocomplete="postal-code" required pattern="[0-9]{4}" maxlength="4" placeholder="e.g. 2333">

      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button id="submitButton" type="submit">JOIN THE WAIT LIST</button>
      <div class="fineprint">By joining the wait list, you agree to receive ACF Club launch updates and information about the early access offer. You can unsubscribe at any time.</div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('earlyAccessForm');
    const button = document.getElementById('submitButton');
    const status = document.getElementById('status');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!form.reportValidity()) return;
      if (document.getElementById('website').value) return;

      const firstName = document.getElementById('firstName').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const postcode = document.getElementById('postcode').value.trim();

      button.disabled = true;
      button.textContent = 'JOINING...';
      status.textContent = '';

      try {
        window.Brevo = window.Brevo || [];

        Brevo.push([
          'identify',
          {
            identifiers: { email_id: email },
            attributes: {
              FIRSTNAME: firstName,
              EARLY_ACCESS_POSTCODE: postcode,
              CONTACT_SOURCE: 'ACF Club Early Access',
              OPT_IN: true
            }
          }
        ]);

        Brevo.push([
          'track',
          'early_access_signup',
          {
            email: email,
            FIRSTNAME: firstName,
            EARLY_ACCESS_POSTCODE: postcode,
            CONTACT_SOURCE: 'ACF Club Early Access',
            OPT_IN: true
          }
        ]);

        status.textContent = "Thanks, you're on the ACF Club early access wait list.";
        form.reset();
      } catch (error) {
        status.textContent = 'Something went wrong. Please try again.';
      } finally {
        button.disabled = false;
        button.textContent = 'JOIN THE WAIT LIST';
      }
    });
  </script>
</body>
</html>
