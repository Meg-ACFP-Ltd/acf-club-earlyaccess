<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACF Club Early Access</title><meta name="description" content="Join the ACF Club early access wait-list."><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff;color:#111827;font-family:Arial,Helvetica,sans-serif}main{width:100%;max-width:470px}h1{font-size:32px;line-height:1.15;margin:0 0 16px}p{font-size:17px;line-height:1.55;margin:0 0 25px}label{display:block;font-weight:700;margin:0 0 7px}input[type=text],input[type=email]{width:100%;font:inherit;padding:14px 15px;border:1px solid #cbd5e1;border-radius:8px;margin:0 0 17px}input:focus-visible,button:focus-visible{outline:2px solid #1d3d7a;outline-offset:3px}.confirm{display:flex;align-items:flex-start;gap:11px;margin:5px 0 18px;font-size:14px;line-height:1.4}.confirm input{margin-top:3px;flex-shrink:0}button{width:100%;padding:15px 17px;background:#111827;color:#fff;font-size:16px;font-weight:700;border:0;border-radius:8px;cursor:pointer}button:disabled{cursor:wait;opacity:.65}.fine{font-size:12px;color:#64748b;margin:13px 0 0}.status{font-size:15px;line-height:1.4;margin-top:18px;min-height:23px}.error{color:#aa2525}.ok{color:#17643b}.hp{position:absolute;left:-9999px;pointer-events:none;opacity:0}</style></head><body><main><h1>Join the wait list</h1><p>Join the wait list to hear about when ACF Club will launch and receive 3 months free when you sign up in the launch window.</p><form id="signup"><label for="firstName">First name</label><input id="firstName" name="firstName" type="text" maxlength="80" autocomplete="given-name" required><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required><label for="postcode">Postcode</label><input id="postcode" name="postcode" type="text" pattern="[0-9]{4}" maxlength="4" inputmode="numeric" autocomplete="postal-code" placeholder="e.g. 2333" required><div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div><label class="confirm" for="consent"><input type="checkbox" id="consent" required><span>Please email me a confirmation link. I understand I will join the wait-list only after I confirm my email address.</span></label><button type="submit" id="submitBtn">Send my confirmation email</button><div id="status" class="status" role="status" aria-live="polite"></div><p class="fine">We will only use your details for ACF Club launch updates and the early access offer. You can unsubscribe at any time.</p></form></main><script>const form=document.querySelector('#signup'),button=document.querySelector('#submitBtn'),status=document.querySelector('#status');form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;button.disabled=true;button.textContent='Sending...';status.textContent='';status.className='status';try{const response=await fetch('https://acf-earlyaccess-doi-api.vercel.app/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName:form.firstName.value.trim(),email:form.email.value.trim(),postcode:form.postcode.value.trim(),consent:form.consent.checked,website:form.website.value})});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'Unable to send a confirmation email. Please try again.');status.textContent='Please check your inbox and click the confirmation link. You are not on the wait-list until you confirm.';status.classList.add('ok');form.reset();}catch(error){status.textContent=error.message||'The confirmation service is temporarily unavailable. Please try again.';status.classList.add('error');}finally{button.disabled=false;button.textContent='Send my confirmation email';}});</script></body></html>
